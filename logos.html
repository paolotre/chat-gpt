<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Scroller</title>
<style>
  .scroller {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    position: relative;
    box-sizing: border-box;
  }
  .scroller__inner {
    display: flex;
    flex-wrap: nowrap;
    gap: 2rem; /* Spazio tra i loghi */
  }
  /* Effetto fade su entrambi i lati */
  .scroller[data-animated="true"] {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, white 10%, white 90%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, white 10%, white 90%, transparent 100%);
  }
  .scroller[data-animated="true"] .scroller__inner {
    width: max-content;
    animation: scroll var(--_animation-duration, 40s) var(--_animation-direction, forwards) linear infinite;
  }
  .scroller[data-direction="right"] {
    --_animation-direction: reverse;
  }
  .scroller[data-direction="left"] {
    --_animation-direction: forwards;
  }
  .scroller[data-speed="fast"] {
    --_animation-duration: 20s;
  }
  .scroller[data-speed="slow"] {
    --_animation-duration: 100s;
  }
  @keyframes scroll {
    to {
      transform: translateX(calc(-50% - 0.5rem));
    }
  }
  .scroller img {
    height: 80px;
    width: 80px;
    object-fit: contain; /* Mantiene il rapporto senza sformare l'immagine */
    filter: grayscale(100%); /* Loghi in bianco e nero */
    display: inline-block;
  }
  @media (max-width: 932px) {
    .scroller img {
      width: 60px;
      height: 60px;
    }
  }
</style>
</head>
<body>
<div class="scroller" data-direction="left" data-speed="slow">

</div>
<script>
const scrollers = document.querySelectorAll(".scroller");
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  addAnimation();
}
function addAnimation() {
  scrollers.forEach((scroller) => {
    scroller.setAttribute("data-animated", true);
    const scrollerInner = scroller.querySelector(".scroller__inner");
    const scrollerContent = Array.from(scrollerInner.children);
    // Duplichiamo i loghi per creare un effetto "loop" infinito
    scrollerContent.forEach((item) => {
      const duplicatedItem = item.cloneNode(true);
      duplicatedItem.setAttribute("aria-hidden", true);
      scrollerInner.appendChild(duplicatedItem);
    });
  });
}
</script>
